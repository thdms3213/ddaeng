<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="disabled-adaptations" content="watch">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>땡땡이 워치</title>
<style>
@font-face{font-family:'Pretendard';src:url(../assets/fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:swap}
:root{--lime:#C5F656;--blue:#5C61FF;--g1:#91DF1D;--g2:#6CC9D3;--g3:#4F55CD;--card:#1A1A1A;--line:#484848;--sub:#B8B8B8;--w:#FDFDFD}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:var(--w);font-family:'Pretendard',-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- stage: designed at 187×223 (Figma), scaled to the watch ---------- */
#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:187px;height:223px;overflow:hidden;background:#000;transform-origin:center center}
body.big{background:#0B0B0D}
body.big #bezel{position:absolute;border-radius:62px;background:#1A1A1C;box-shadow:0 0 0 2px #2C2C30, 0 30px 80px rgba(0,0,0,.6)}
body.big #stage{border-radius:44px}
#hint{display:none;position:fixed;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:#6B6B70}
body.big #hint{display:block}

.layer{position:absolute;inset:0;background:#000}
.in-r{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}.out-l{animation:outL .38s cubic-bezier(.2,.8,.2,1) both}
.in-l{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}.out-r{animation:outR .38s cubic-bezier(.2,.8,.2,1) both}
.in-up{animation:inUp .42s cubic-bezier(.2,.9,.25,1) both}.out-fade{animation:outF .3s ease both}
.in-zoom{animation:inZ .42s cubic-bezier(.2,.9,.25,1) both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{to{transform:translateX(-30%);opacity:.3}}
@keyframes inL{from{transform:translateX(-30%);opacity:.3}to{transform:none;opacity:1}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes inUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes outF{to{opacity:0;transform:scale(.94)}}
@keyframes inZ{from{transform:scale(1.12);opacity:0}to{transform:none;opacity:1}}

/* ---------- common pieces ---------- */
.hd{position:absolute;left:8px;right:9px;top:16px;height:16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:16px;font-weight:500;z-index:5}
.hd .t{display:flex;align-items:center;gap:6px;color:var(--lime)}
.hd .t svg{width:8px;height:14px;flex:none}
.hd .ck{color:var(--w);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hd button.t{padding:6px 10px 6px 4px;margin:-6px 0 -6px -4px}
.pos{position:absolute}
.h1{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.lime{color:var(--lime)}.sub{color:var(--sub)}
.press{transition:transform .14s ease, filter .14s ease}
.press:active{transform:scale(.92);filter:brightness(1.15)}
.grad{background:linear-gradient(118deg,var(--g1) 0%,var(--g2) 58%,var(--g3) 100%);box-shadow:inset 0 0 15px rgba(255,255,255,.62)}
.gradc{background:linear-gradient(142deg,var(--g1) 30%,var(--g2) 78%,var(--g3) 112%);box-shadow:inset 0 0 15px rgba(255,255,255,.62)}
.pill{position:absolute;left:8px;width:171px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#1A1A1A}
.cbtn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:7px}
.cbtn .c{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cbtn .c.x{background:var(--card);border:2px solid var(--line)}
.cbtn .c.g{width:56px;height:56px}
.cbtn .l{font-size:10px;line-height:12px;font-weight:600}

/* G1 waiting */
.enter{position:absolute;left:53.5px;top:40px;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#1A1A1A;animation:breathe 2.6s ease-in-out infinite}
.enter::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--lime);opacity:0;animation:ripple 2.6s ease-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ripple{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.enter.go{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1.25);opacity:0}}
.dark{position:absolute;left:8px;width:171px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}

/* list cards */
.card{text-align:left;position:absolute;left:8px;width:171px;height:54px;border-radius:12px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 12px 0 8px}
.card img{width:20px;height:20px;flex:none}
.card .tt{font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.02em}
.card .ss{font-size:12px;line-height:16px;font-weight:600}
.card .more{margin-left:auto;color:var(--sub);font-size:12px;letter-spacing:1px;align-self:center}

/* G2 menu */
.tile{position:absolute;width:81.5px;height:79.5px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.tile svg{height:24px;width:auto}
.tile span{font-size:11.5px;line-height:13px;font-weight:600}
.tile:active svg{animation:wig .3s ease}
@keyframes wig{30%{transform:rotate(-12deg) scale(1.1)}70%{transform:rotate(10deg)}}

/* radar */
.radar{position:absolute;left:41.5px;top:40px;width:104px;height:104px}
.radar .ring{position:absolute;border-radius:50%;border:1px solid var(--line)}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg, rgba(197,246,86,.18) 0deg 90deg, transparent 90deg 360deg);animation:spin 3.2s linear infinite}
.sweep::after{content:"";position:absolute;left:50%;top:0;width:1.5px;height:50%;background:linear-gradient(var(--lime),rgba(197,246,86,0));transform:translateX(-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--blue);animation:blink 3.2s linear infinite}
@keyframes blink{0%,6%{box-shadow:0 0 0 0 rgba(92,97,255,.0);transform:scale(1)}2%{box-shadow:0 0 0 4px rgba(92,97,255,.35);transform:scale(1.35)}}
.me{position:absolute;left:50%;top:50%;width:9.5px;height:9.5px;margin:-4.75px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(197,246,86,.5);animation:me 1.6s ease-out infinite}
@keyframes me{to{box-shadow:0 0 0 8px rgba(197,246,86,0)}}
.out{position:absolute;width:9.5px;height:9.5px;margin:-4.75px;border-radius:50%;border:3px solid var(--w);transition:left 1.4s cubic-bezier(.5,0,.2,1), top 1.4s cubic-bezier(.5,0,.2,1), border-color 1.4s, background 1.4s}
.out.back{border-color:var(--blue);background:var(--blue)}
.cnt{position:absolute;top:144px;display:flex;align-items:baseline;gap:5px}
.cnt b{font-size:18px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt span{font-size:10px;font-weight:600;color:var(--sub)}
.callbar{position:absolute;left:8px;top:172px;width:171px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 13px;font-size:12px;font-weight:600}
.callbar button{width:56px;height:28px;border-radius:14px;background:var(--lime);color:#1A1A1A;font-size:12px;font-weight:700}
.allin{position:absolute;left:0;right:0;top:151px;text-align:center}
.allin .h1{color:var(--lime);animation:inZ .5s cubic-bezier(.3,1.6,.5,1) both}

/* timer */
.tmr{position:absolute;left:23.5px;width:140px;height:140px}
.tmr svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tmr .arc{transition:stroke-dashoffset 1s linear}
.tmr .num{position:absolute;left:0;right:0;top:38px;text-align:center;font-size:37px;line-height:40px;font-weight:700;color:var(--lime);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tmr .lb{position:absolute;left:0;right:0;top:83px;text-align:center;font-size:12px;font-weight:600;color:var(--sub)}
.rbtn{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rbtn.grey{background:var(--line)}
.sync{position:absolute;left:0;right:0;top:192px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:var(--sub)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:me 1.6s ease-out infinite}
.tmr.low .num{animation:tick 1s ease-in-out infinite}
@keyframes tick{50%{transform:scale(1.06)}}

/* call / alerts */
.ringwave{position:absolute;border-radius:50%;border:2px solid var(--lime);opacity:0;animation:wave 1.4s ease-out infinite}
@keyframes wave{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
.toast{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:20}
.toast .bubble{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.toast p{font-size:15px;line-height:20px;font-weight:700}
.bob{animation:bob2 2.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-5px)}}
.warn{animation:warn 1.2s ease-in-out infinite}
@keyframes warn{50%{transform:scale(1.12)}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(26,26,26,.25);border-top-color:#1A1A1A;animation:spin .8s linear infinite}

/* complete */
.stat b{display:block;font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat > span{font-size:10px;font-weight:600;color:var(--sub)}
.confetti{position:absolute;width:6px;height:6px;border-radius:50%;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) both}
@keyframes fall{from{transform:translateY(-30px) scale(.4);opacity:0}20%{opacity:1}to{transform:translateY(240px) rotate(200deg);opacity:0}}

/* demo menu */
#demo{position:absolute;inset:0;background:rgba(0,0,0,.94);z-index:50;overflow-y:auto;padding:14px 8px 20px;display:none;-webkit-overflow-scrolling:touch}
#demo.on{display:block}
#demo h2{font-size:12px;color:var(--lime);margin:0 0 8px 4px}
#demo button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:5px;border-radius:10px;background:var(--card);font-size:12px;font-weight:600}
#demo button.on{background:var(--lime);color:#1A1A1A}
</style>
</head>

function render(name,anim){
  var el=document.createElement('section'); el.className='layer'; el.innerHTML=V[name](); el.setAttribute('aria-label',TITLE[name]);
  var old=cur; cur=el; S.screen=name; stage.appendChild(el);
  var inA={push:'in-r',back:'in-l',modal:'in-up',zoom:'in-zoom'}[anim||'zoom'], outA={push:'out-l',back:'out-r',modal:'out-fade',zoom:'out-fade'}[anim||'zoom'];
  el.classList.add(inA);
  if(old){ old.classList.add(outA); old.style.pointerEvents='none'; setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },420); }
  after(name);
}
function go(name,anim){ if(anim==='push') stack.push(S.screen); render(name,anim); }
function back(){ var p=stack.pop()||'menu'; render(p,'back'); }
function reset(){ stack=[]; }

function after(name){
  if(name==='done'){ var el=S.tStarted?(S.tSet-S.tLeft):0; countUp('cm',el>=60?Math.round(el/60):25,900); countUp('cp',6,700); }
}
function countUp(id,to,ms){ var el=document.getElementById(id); if(!el) return; var t0=performance.now(); (function f(t){ var p=Math.min(1,(t-t0)/ms); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); })(t0); }

function toast(html,ms,then){
  var t=document.createElement('div'); t.className='toast in-zoom'; t.innerHTML=html; cur.appendChild(t);
  setTimeout(function(){ t.classList.remove('in-zoom'); t.classList.add('out-fade'); setTimeout(function(){ t.remove(); if(then) then(); },300); },ms);
}

/* ---------- timer engine ---------- */
function tick(){
  if(S.role==='leader'&&S.tRun){ S.tLeft=Math.max(0,S.tSet-(Date.now()-S.startAt)/1000); }
  if(S.role==='member'){ S.memberLeft=Math.max(0,S.memberLeft-1); }
  if(S.screen==='timer'){
    var left=S.role==='member'?S.memberLeft:S.tLeft, total=S.role==='member'?300:S.tSet;
    var n=document.getElementById('tnum'), a=document.getElementById('arc');
    if(n&&(S.role==='member'||S.tStarted)){ n.textContent=mmss(left); var C=2*Math.PI*67.9; a.setAttribute('stroke-dashoffset',(C*(1-left/total)).toFixed(2)); n.parentNode.classList.toggle('low',left<=30); }
  }
  if(S.role==='leader'&&S.tRun&&S.tLeft<=0){ S.tRun=false; stack=[]; go('done','modal'); }
  if(S.role==='member'&&S.memberLeft<=0&&S.screen==='timer'){ S.memberLeft=300; stack=[]; go('done','modal'); }
  var cks=stage.querySelectorAll('.ck'); for(var i=0;i<cks.length;i++) cks[i].textContent=clock();
}

 finish:function(){ S.allIn=false; S.called=false; S.tStarted=false; S.tRun=false; S.tLeft=S.tSet; reset(); render('wait','modal'); },
 reconnect:function(b){ b.innerHTML='<i class="spin"></i>'; setTimeout(function(){ reset(); render('menu','zoom'); },1300); }
};
stage.addEventListener('click',function(e){ var b=e.target.closest('[data-a]'); if(!b||lpFired) return; var f=A[b.getAttribute('data-a')]; if(f) f(b); });

/* ---------- demo menu (long-press title or clock) ---------- */
var demo=document.createElement('div'); demo.id='demo'; stage.appendChild(demo);
var lpT=null, lpFired=false;
function openDemo(){
  var items=[['wait','대기 화면'],['list','다른 모임'],['menu','놀이 중 (메뉴)'],['radar','놀이 레이더'],['radarAll','레이더 · 모두 구역 안'],['call','친구 부르기'],['warn','구역 이탈 경고'],['ggo','못 찾겠다 꾀꼬리'],['all','모두 집합'],['timer','놀이 타이머'],['done','놀이 완료'],['lost','연결 끊김']];
  var h='<h2>시연 메뉴</h2>'; items.forEach(function(x){ h+='<button data-d="'+x[0]+'">'+x[1]+'</button>'; });
  h+='<h2 style="margin-top:10px">역할</h2><button data-r="leader" class="'+(S.role==='leader'?'on':'')+'">대장 (타이머 조작)</button><button data-r="member" class="'+(S.role==='member'?'on':'')+'">참여자 (대장과 동기화)</button><button data-d="x" style="margin-top:10px;text-align:center">닫기</button>';
  demo.innerHTML=h; demo.classList.add('on'); demo.scrollTop=0;
}
demo.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return; e.stopPropagation();
  var r=b.getAttribute('data-r'); if(r){ S.role=r; if(r==='member') S.memberLeft=222; openDemo(); return; }
  var d=b.getAttribute('data-d'); demo.classList.remove('on'); if(d==='x') return;
  stack=(['wait','menu','done','lost','warn'].indexOf(d)>=0||d==='list')?(d==='list'?['wait']:[]):['menu'];
  if(d==='call') stack=['menu','radar'];
  S.allIn=(d==='radarAll'); if(d==='radar'){ S.allIn=false; }
  render(d==='radarAll'?'radar':d,'zoom');
});
function lpStart(e){ var t=e.target.closest('[data-lp],.hd .t'); if(!t) return; lpFired=false; clearTimeout(lpT); lpT=setTimeout(function(){ lpFired=true; openDemo(); setTimeout(function(){ lpFired=false; },400); },650); }
function lpEnd(){ clearTimeout(lpT); }
stage.addEventListener('touchstart',lpStart,{passive:true}); stage.addEventListener('touchend',lpEnd); stage.addEventListener('touchmove',lpEnd,{passive:true});
stage.addEventListener('mousedown',lpStart); stage.addEventListener('mouseup',lpEnd); stage.addEventListener('mouseleave',lpEnd);
document.addEventListener('keydown',function(e){ if(e.key==='d'||e.key==='D') openDemo(); if(e.key==='Escape') demo.classList.remove('on'); });
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

/* ---------- fit to the screen ---------- */
function fit(){
  var W=window.innerWidth, H=window.innerHeight, big=W>360&&H>360;
  document.body.classList.toggle('big',big);
  var s=big?Math.min((W-80)/187,(H-120)/223,3.2):Math.min(W/187,H/223);
  stage.style.transform='scale('+s+')';
  var bz=document.getElementById('bezel'); if(big){ bz.style.width=(187*s+44)+'px'; bz.style.height=(223*s+44)+'px'; }
}
window.addEventListener('resize',fit); fit();

render('wait','zoom');
})();
</script>
