<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1A1A1A">
<title>땡땡이 포켓</title>
<link rel="icon" href="../assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

.mctl{display:none}
body.m .mctl{display:block}
body.m #app>div{min-height:0!important;height:100dvh!important}
.mctl .pad,.mctl .ab{position:fixed;z-index:50;display:grid;gap:10px}
.mctl button{width:62px;height:62px;border-radius:50%;border:3px solid #1A1A1A;background:#FDFDFD;box-shadow:0 5px 0 #1A1A1A;font:400 15px 'Press Start 2P',monospace;color:#1A1A1A;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;padding:0}
.mctl button:active,.mctl button.on{transform:translateY(4px);box-shadow:0 1px 0 #1A1A1A}
.mctl .a{background:#C5F656;width:70px;height:70px}
.mctl .b{background:#FF8FE0}
.mctl .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.mctl .pad button{width:52px;height:52px;border-radius:14px;background:#1A1A1A;box-shadow:0 4px 0 #000}
.mctl .pad button svg{pointer-events:none}
.mctl .pad .u{grid-area:1/2}.mctl .pad .l{grid-area:2/1}.mctl .pad .r{grid-area:2/3}.mctl .pad .d{grid-area:3/2}
.mctl .pad.two{grid-template-rows:52px}.mctl .pad.two .l{grid-area:1/1}.mctl .pad.two .r{grid-area:1/3}
body.land .mctl .pad{left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%)}
body.land .mctl .ab{right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);grid-template-columns:1fr}
body.port .mctl .pad{left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
body.port .mctl .ab{right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);grid-template-columns:62px 70px;align-items:end}
body.port .mctl .ab .b{margin-bottom:18px}
.mctl .rot{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:50;background:#1A1A1A;color:#FDFDFD;font:700 13px Pretendard,system-ui,sans-serif;padding:8px 14px;border-radius:999px;white-space:nowrap}
body.port .mctl .rot{display:block}

</style>
</head>
<body>
<div id="app"></div>
<div class="mctl" aria-label="화면 조작 버튼"><p class="rot">가로로 돌리면 더 크게 볼 수 있어요</p><div class="pad"><button class="u" data-k="u" aria-label="위"><svg width="16" height="16" viewBox="0 0 18 14" aria-hidden="true"><path d="M9 2l7 10H2z" fill="#C5F656"></path></svg></button><button class="l" data-k="l" aria-label="왼쪽"><svg width="16" height="16" viewBox="0 0 18 14" aria-hidden="true"><path d="M2 9l10-7v14z" fill="#C5F656"></path></svg></button><button class="r" data-k="r" aria-label="오른쪽"><svg width="16" height="16" viewBox="0 0 18 14" aria-hidden="true"><path d="M12 9L2 2v14z" fill="#C5F656"></path></svg></button><button class="d" data-k="d" aria-label="아래"><svg width="16" height="16" viewBox="0 0 18 14" aria-hidden="true"><path d="M9 12L2 2h14z" fill="#C5F656"></path></svg></button></div><div class="ab"><button class="b" data-k="B" aria-label="B 버튼">B</button><button class="a" data-k="A" aria-label="A 버튼">A</button></div></div>
<template id="tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url(../assets/fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;background:#F4FBE3}
button{font-family:inherit;cursor:pointer;color:inherit}
.px{font-family:'Press Start 2P',monospace}
.ln{border:4px solid #1A1A1A;box-sizing:border-box}
.body{position:absolute;left:8px;top:40px;width:1523px;height:710px;border-radius:140px;background:#5258EE;box-shadow:inset -18px -22px 0 rgba(26,26,26,.18), inset 14px 14px 0 rgba(255,255,255,.18), 14px 16px 0 #1A1A1A}
.shoulder{position:absolute;top:10px;width:260px;height:64px;border-radius:40px 40px 0 0;background:#3F44C7;transition:transform .08s}
.shoulder.down{transform:translateY(6px)}
.bez{position:absolute;left:250px;top:36px;width:1023px;height:630px;border-radius:40px;background:#1A1A1A}
.scrw{position:absolute;left:10px;top:10px;width:1003px;height:565px;border-radius:26px;overflow:hidden;background:#0B0B10}
.scr{position:absolute;left:0;top:0;width:760px;height:428px;transform:scale(1.32);transform-origin:0 0;background:#0B0B10;overflow:hidden;outline:none}
.scr:focus-visible{box-shadow:0 0 0 4px #C5F656}
.led{position:absolute;left:30px;top:596px;width:12px;height:12px;border-radius:50%;background:#3A3A3A}
.led.on{background:#C5F656;box-shadow:0 0 10px #C5F656}
.dpad{position:absolute;left:35px;top:220px;width:180px;height:180px}
.dpad button{position:absolute;width:60px;height:60px;background:#1A1A1A;border:0;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .06s}
.dpad button:active,.dpad button.down{transform:scale(.92);background:#000}
.face{position:absolute;width:74px;height:74px;border-radius:50%;border:4px solid #1A1A1A;box-shadow:0 7px 0 #1A1A1A;font-family:'Press Start 2P',monospace;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .07s, box-shadow .07s}
.face:active,.face.down{transform:translateY(6px);box-shadow:0 1px 0 #1A1A1A}
.pill{position:absolute;width:64px;height:20px;border-radius:10px;background:#1A1A1A;border:0;transform:rotate(-24deg)}
.pill:active{background:#000;transform:rotate(-24deg) scale(.92)}
.pw{position:absolute;left:722px;top:-8px;width:96px;height:30px;border-radius:15px;background:#1A1A1A;border:0;padding:0}
.pw span{position:absolute;top:4px;left:6px;width:40px;height:22px;border-radius:11px;background:#FDFDFD;transition:left .25s cubic-bezier(.3,1.5,.5,1)}
.pw.on span{left:50px;background:#C5F656}
.spk{position:absolute;display:grid;grid-template-columns:repeat(3,10px);gap:8px}
.spk i{width:10px;height:10px;border-radius:50%;background:#2E32A8}
.stick{position:absolute;width:96px;height:96px;border-radius:50%;background:#1A1A1A;display:flex;align-items:center;justify-content:center}
.stick i{width:62px;height:62px;border-radius:50%;background:#3A3A3A;box-shadow:inset 0 -6px 0 rgba(0,0,0,.4)}
/* screen contents */
.boot{position:absolute;inset:0;background:#FDFDFD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.boot img{animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-200px);opacity:0}}
.home{position:absolute;inset:0;background:#EEF0F7;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:scale(1.03)}}
.topbar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:800}
.row{position:absolute;left:0;top:96px;height:210px;display:flex;align-items:center;gap:18px;transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.pick{position:absolute;top:134px;width:264px;height:216px;border-radius:22px;border:3px solid #1A1A1A;background:#FDFDFD;box-shadow:0 6px 0 #1A1A1A;padding:0;text-align:left;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .2s}
.pick.sel{transform:translateY(-4px) scale(1.04);box-shadow:0 6px 0 #1A1A1A, 0 0 0 5px #5258EE}
.cart{flex:none;width:170px;height:170px;border-radius:14px;border:4px solid #EEF0F7;box-sizing:border-box;overflow:hidden;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1), border-color .2s;background:#FDFDFD;padding:0}
.cart.sel{transform:scale(1.12);border-color:#1A1A1A;box-shadow:0 0 0 4px #C5F656}
.cart img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cart .num{position:absolute;left:8px;top:8px;font-family:'Press Start 2P',monospace;font-size:10px;background:#FDFDFD;border:2px solid #1A1A1A;border-radius:6px;padding:4px 6px}
.dock{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:14px}
.dock span{width:44px;height:44px;border-radius:50%;background:#FDFDFD;border:2px solid #D5D7E2;display:flex;align-items:center;justify-content:center}
.view{position:absolute;inset:0;background:#FDFDFD;animation:slide .35s cubic-bezier(.3,1.2,.5,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.hint{position:absolute;right:20px;bottom:14px;display:flex;gap:14px;font-size:12px;font-weight:800;color:#5C5C5C}
.hint b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#1A1A1A;color:#FDFDFD;font-family:'Press Start 2P',monospace;font-size:8px;align-items:center;justify-content:center;margin-right:5px}
@keyframes blink{50%{opacity:0}}
.lf{display:flex;gap:7px}
.lf i{width:16px;height:16px;border-radius:50%;border:2.5px solid #FDFDFD;box-sizing:border-box}
.lf i.on{background:#FDFDFD}
.vn{flex:none;width:24px;height:24px;margin-top:0;border-radius:50%;background:#C5F656;border:2px solid #1A1A1A;box-sizing:border-box;font-family:'Press Start 2P',monospace;font-size:8px;font-weight:400;display:flex;align-items:center;justify-content:center}
.chips{position:absolute;left:28px;right:28px;top:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{height:32px;border-radius:16px;border:2px solid #D5D7E2;background:#FDFDFD;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;color:#8A8A8A;padding:0;white-space:nowrap}
.chip b{font-family:'Press Start 2P',monospace;font-size:7px;font-weight:400}
.chip.on{background:#1A1A1A;border-color:#1A1A1A;color:#FDFDFD}
.chip.on b{color:#C5F656}
.guide{position:fixed;left:0;right:0;bottom:22px;z-index:5;display:flex;justify-content:center;gap:12px;pointer-events:none;min-height:34px}
.guide span{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px 0 5px;border-radius:17px;background:#FDFDFD;border:2px solid #1A1A1A;font-size:15px;font-weight:700;color:#1A1A1A;white-space:nowrap}
.guide b{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:#1A1A1A;color:#C5F656;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
body.m .guide{display:none}
.vrow .vn{background:#FDFDFD;transition:background .2s}.vrow.on .vn{background:#C5F656}.vrow:not(.on) p>b{color:#8A8A8A!important;font-size:15px!important}.vd{display:block;animation:fade .25s both}
.vpanel{position:absolute;left:28px;top:64px;width:200px;height:336px;border-radius:22px;background:#F4FBE3;border:2px solid #E2F3B8;box-sizing:border-box}
.vrow{cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1.5px solid #E3E4EA}
.blink{animation:blink 1s steps(1) infinite}
.clr{position:absolute;inset:0;overflow:hidden;cursor:pointer;background:#5BC8FA;z-index:8;animation:clrfade .9s .5s ease both}
@keyframes clrfade{from{opacity:0}}
.clr .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:clrbg 2.4s .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes clrbg{from{transform:scale(1.06)}}
.clr .run{position:absolute;left:24%;bottom:calc(var(--u)*-18px);width:calc(var(--u)*290px);margin-left:calc(var(--u)*-145px);transform-origin:50% 100%;animation:clrjump 1s 1.2s cubic-bezier(.3,.7,.4,1) both, clrbob 1.4s 2.3s ease-in-out infinite}
@keyframes clrjump{0%{transform:translateY(110%) scale(.9,1.1)}55%{transform:translateY(-14%) rotate(-4deg) scale(1)}78%{transform:translateY(2%) scale(1.06,.94)}100%{transform:translateY(0)}}
@keyframes clrbob{50%{transform:translateY(calc(var(--u)*-8px))}}
.clr .run img{width:100%;display:block;filter:drop-shadow(calc(var(--u)*6px) 0 0 #FDFDFD) drop-shadow(calc(var(--u)*-6px) 0 0 #FDFDFD) drop-shadow(0 calc(var(--u)*6px) 0 #FDFDFD) drop-shadow(0 calc(var(--u)*-6px) 0 #FDFDFD)}
.clr .ht{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(26,26,26,.3) 30%,transparent 33%);background-size:calc(var(--u)*16px) calc(var(--u)*16px);-webkit-mask-image:radial-gradient(ellipse 72% 68% at 50% 42%,transparent 50%,#000 100%);mask-image:radial-gradient(ellipse 72% 68% at 50% 42%,transparent 50%,#000 100%);opacity:.5;animation:clrfade 1.2s .8s ease both}
.clr .say{position:absolute;left:calc(24% + var(--u)*100px);bottom:calc(var(--u)*250px);margin:0;padding:calc(var(--u)*14px) calc(var(--u)*26px);border-radius:calc(var(--u)*28px);background:#FDFDFD;border:calc(var(--u)*3px) solid #1A1A1A;font-size:calc(var(--u)*44px);line-height:1.15;font-weight:900;letter-spacing:-0.03em;color:#1A1A1A;transform-origin:0 100%;animation:clrsay .45s 2.1s cubic-bezier(.3,1.4,.5,1) both}
.clr .say::after{content:'';position:absolute;left:calc(var(--u)*22px);bottom:calc(var(--u)*-15px);width:calc(var(--u)*22px);height:calc(var(--u)*22px);background:#FDFDFD;border-right:calc(var(--u)*3px) solid #1A1A1A;border-bottom:calc(var(--u)*3px) solid #1A1A1A;transform:rotate(45deg) skew(10deg,10deg)}
@keyframes clrsay{from{opacity:0;transform:scale(.6)}}
.clr .again{position:absolute;left:0;right:0;bottom:calc(var(--u)*26px);display:flex;justify-content:center;gap:calc(var(--u)*14px);animation:clrin .5s 3.1s ease both}
.clr .again button{height:calc(var(--u)*58px);padding:0 calc(var(--u)*30px);border-radius:999px;border:calc(var(--u)*3px) solid #1A1A1A;box-shadow:0 calc(var(--u)*5px) 0 #1A1A1A;font-family:inherit;font-size:calc(var(--u)*22px);font-weight:800;color:#1A1A1A;cursor:pointer;transition:transform .1s, box-shadow .1s}
.clr .again button:hover{transform:translateY(calc(var(--u)*-2px))}
.clr .again button:active{transform:translateY(calc(var(--u)*4px));box-shadow:0 calc(var(--u)*1px) 0 #1A1A1A}
.clr .again .ag1{background:#C5F656}
.clr .again .ag2{background:#FDFDFD}
@keyframes clrin{from{opacity:0;transform:translateY(8px)}}
.clr .say{display:none}
.clr .ttl{position:absolute;left:0;right:0;top:11%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*14px);pointer-events:none}
.clr .ey{margin:0;font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*13px);color:#1A1A1A;background:#FDFDFD;border:calc(var(--u)*2px) solid #1A1A1A;border-radius:999px;padding:calc(var(--u)*8px) calc(var(--u)*14px);animation:clrin .4s 1.9s ease both}
.clr .cpill{margin:0;display:flex;padding:calc(var(--u)*14px) calc(var(--u)*40px) calc(var(--u)*18px);border-radius:999px;background:#FDFDFD;border:calc(var(--u)*4px) solid #1A1A1A;box-shadow:0 calc(var(--u)*6px) 0 #1A1A1A;animation:clrpill .5s 2.05s cubic-bezier(.3,1.5,.5,1) both}
@keyframes clrpill{from{transform:scaleX(.2) scaleY(.6);opacity:0}}
.clr .cpill span{display:inline-block;font-size:calc(var(--u)*60px);line-height:1.1;font-weight:700;letter-spacing:-0.02em;color:#1A1A1A;animation:clrlet .5s cubic-bezier(.3,1.8,.5,1) both}
.clr .cpill span.sp{width:calc(var(--u)*22px)}
@keyframes clrlet{from{transform:translateY(calc(var(--u)*24px)) scale(.4);opacity:0}}
</style>
</helmet>
<div style="height: 100vh; min-height: 520px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Pretendard', system-ui, sans-serif; color: #1A1A1A; word-break: keep-all; background-color: #F4FBE3; background-image: radial-gradient(#C5F656 1.6px, transparent 2px); background-size: 22px 22px">

<button style="left: 0; top: 60px; border-radius: 12px 0 0 12px" onClick="{{left}}" aria-label="왼쪽"><svg width="16" height="20" viewBox="0 0 14 18" aria-hidden="true"><path d="M2 9l10-7v14z" fill="#4A4A4A"></path></svg></button>
<span style="position: absolute; left: 60px; top: 60px; width: 60px; height: 60px; background: #1A1A1A"></span>

</div>

    window.addEventListener('resize',this.fit); window.addEventListener('orientationchange',function(){ setTimeout(self.fit,250); });
    this.fit(); setTimeout(this.fit,60); setTimeout(this.fit,400);
  };
  var comp=DCLite.mount(document.getElementById('app'),document.getElementById('tpl'),Component);
  var KIND='pocket', rep=null;
  function press(k){
    var m=comp.state.mode;
    if(k==='A'){ if(m==='off'){ if(KIND==='arcade'){ if(!comp.state.coinCls) comp.insert(); } else comp.power(); } else comp.A(); return; }
    if(k==='B'){ comp.B(); return; }
    var dx=k==='l'?-1:k==='r'?1:0, dy=k==='u'?-1:k==='d'?1:0;
    if(KIND==='arcade'){ if(m==='game'){ comp.joy=dx; comp.setState({joyDeg:dx*24}); } else comp.dir(dx||dy); return; }
    comp.dir(dx,dy); if(m==='game'){ clearInterval(rep); rep=setInterval(function(){ comp.dir(dx,dy); },80); }
  }
  function release(){ clearInterval(rep); rep=null; if(KIND==='arcade'&&comp.joy){ comp.joy=0; comp.setState({joyDeg:0}); } document.querySelectorAll('.mctl button.on').forEach(function(b){ b.classList.remove('on'); }); }
  document.querySelectorAll('.mctl [data-k]').forEach(function(btn){
    btn.addEventListener('pointerdown',function(e){ e.preventDefault(); btn.classList.add('on'); try{ btn.setPointerCapture(e.pointerId); }catch(x){} press(btn.dataset.k); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){ btn.addEventListener(ev,release); });
    btn.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  });
})();

</script>
